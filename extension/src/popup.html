<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Desktop GIFs</title>
  <style>
    :root { color-scheme: dark; }
    body {
      box-sizing: border-box;
      width: 288px;
      margin: 0;
      padding: 14px 16px 12px;
      background: #212121;
      color: #f1f1f1;
      font: 13px/1.45 Roboto, Arial, sans-serif;
    }
    header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    header img { width: 24px; height: 24px; border-radius: 6px; }
    h1 { font-size: 14px; font-weight: 500; margin: 0; }
    .status {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 10px; padding: 9px 11px;
      border-radius: 8px; background: rgba(255, 255, 255, .08);
    }
    .status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #ff7b7b; }
    .status[data-on="true"] .dot { background: #2ba640; }
    button {
      display: block; width: 100%; box-sizing: border-box;
      margin: 0 0 10px; padding: 8px 12px;
      border: 0; border-radius: 18px;
      background: #065fd4; color: #fff;
      font: 500 13px/1.2 Roboto, Arial, sans-serif;
      cursor: pointer;
    }
    button:hover { background: #3172e5; }
    button[disabled] { background: rgba(255, 255, 255, .12); color: #aaa; cursor: default; }
    .note { margin: 0; color: #aaa; font-size: 12px; }
    .note[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="">
    <h1>Desktop GIFs</h1>
  </header>
  <p class="status" id="status" role="status"><span class="dot"></span><span id="status-text">Checking…</span></p>
  <button id="allow" type="button" hidden>Allow Tenor access</button>
  <p class="note" id="note">Search needs access to tenor.com. Nothing else is read or stored.</p>
  <p class="note" id="reload-note" hidden>If a YouTube tab was already open, reload it to get the GIF button.</p>
  <script src="popup.js"></script>
</body>
</html>
